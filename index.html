<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Harbor – GitHub Pages demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Pixel Harbor</h1>
  <p>A tiny demo site, hosted for free on GitHub Pages.</p>
</header>

<main>
  <section class="card">
    <h2>Live clock</h2>
    <p id="clock" aria-live="polite">--:--:--</p>
  </section>

  <section class="card">
    <h2>Click counter</h2>
    <p><span id="count">0</span> clicks</p>
    <button id="add">Add a click</button>
    <button id="reset" class="ghost">Reset</button>
  </section>

  <section class="card">
    <h2>Theme</h2>
    <p>Your choice is remembered in this browser.</p>
    <button id="theme">Switch theme</button>
  </section>
</main>

<footer>
  <p>If you can read this on a github.io address, your site is live.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
